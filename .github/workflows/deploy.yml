name: Deploy to Environment

on:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'dev' && 'development' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display deployment info
        run: |
          echo "Deploying to: ${{ vars.SITE_TITLE }}"
          echo "Deploy path: ${{ vars.DEPLOY_PATH }}"
          echo "Site color: ${{ vars.SITE_COLOR }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "SSH Key loaded: ${{ secrets.SSH_PRIVATE_KEY != '' }}"

      - name: Replace placeholders with environment values
        run: |
          DEPLOY_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          sed -i "s|__SITE_TITLE__|${{ vars.SITE_TITLE }}|g" index.html
          sed -i "s|__SITE_COLOR__|${{ vars.SITE_COLOR }}|g" style.css
          sed -i "s|__DEPLOY_TIME__|${DEPLOY_TIME}|g" index.html
          sed -i "s|__COMMIT_SHA__|${COMMIT_SHA}|g" index.html
          sed -i "s|__SITE_TITLE__|${{ vars.SITE_TITLE }}|g" app.js
          sed -i "s|__DEPLOY_TIME__|${DEPLOY_TIME}|g" app.js

          echo "Placeholders replaced"

      - name: Deploy to EC2 via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "1. Checking SSH key..."
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          echo "OK: key is valid"

          
      
         
          echo "2. Scanning EC2 host..."
          
          echo "Testing TCP port 22..."
          if timeout 5 bash -c '</dev/tcp/'"$DEPLOY_HOST"'/22' 2>/dev/null; then
            echo "TCP port 22 is reachable"
          else
            echo "TCP port 22 is NOT reachable"
          fi


          ssh-keyscan -v -T 10 -H "$DEPLOY_HOST" \
            >> ~/.ssh/known_hosts 2> /tmp/keyscan-error.txt || true

          if [ -s ~/.ssh/known_hosts ]; then
            echo "OK: host key received"
          else
            echo "ERROR: no host key received"
            cat /tmp/keyscan-error.txt
            exit 1
          fi


          echo "3. Testing SSH connection..."
          ssh -v -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo SSH_OK"

          echo "4. Copying files..."
          scp -v -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            index.html style.css app.js \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          echo "OK: deployment completed"



      - name: Verify deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "ls -la '$DEPLOY_PATH'"

          echo "Deployment verified!"
